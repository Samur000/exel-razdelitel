<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разделитель Excel</title>
<meta name="description" content="Делит Excel-файл на отдельные файлы по значениям выбранной колонки. Работает в браузере, файлы никуда не отправляются.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='4' fill='%2317603A'/%3E%3Cpath d='M7 8h10M7 12h10M7 16h10' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
  <span class="topbar__title">Разделитель Excel</span>
  <span class="topbar__note">Файлы никуда не отправляются — всё считается в браузере</span>
</header>

<div class="layout">
  <aside class="panel" aria-label="Настройки">
    <section class="block">
      <h2 class="block__label">Файл</h2>
      <div id="fileZone"></div>
      <input id="fileInput" type="file" hidden>
    </section>

    <section class="block" id="sheetBlock" hidden>
      <h2 class="block__label">Лист</h2>
      <div id="sheetList" class="chips"></div>
    </section>

    <section class="block" id="colBlock" hidden>
      <h2 class="block__label">Делить по колонке</h2>
      <div id="colList" class="cols"></div>
    </section>
  </aside>

  <main class="main" id="main" aria-live="polite"></main>
</div>

<dialog id="previewDlg" class="dlg" aria-labelledby="previewTitle">
  <div class="dlg__head">
    <h2 id="previewTitle" class="dlg__title"></h2>
    <button type="button" class="icon-btn" id="previewClose" aria-label="Закрыть предпросмотр">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg__body" id="previewBody"></div>
  <div class="dlg__foot">
    <span id="previewNote" class="muted"></span>
    <button type="button" class="btn btn--primary" id="previewDownload">Скачать этот файл</button>
  </div>
</dialog>

<script src="vendor/exceljs.min.js" defer></script>
<script src="vendor/xlsx.full.min.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script src="js/splitter.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
